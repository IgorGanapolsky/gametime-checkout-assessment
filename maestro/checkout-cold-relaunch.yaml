appId: host.exp.exponent
name: Slow accepted charge survives force-stop and relaunch
---
- openLink: exp://127.0.0.1:8082
- tapOn:
    text: "Igor Ganapolsky"
    optional: true
- openLink: exp://127.0.0.1:8082
- tapOn:
    id: payment-status-done
    optional: true
- extendedWaitUntil:
    visible:
      id: checkout-screen
    timeout: 60000
- tapOn:
    id: review-lab-open
- scrollUntilVisible:
    element:
      id: review-lab-reset
    direction: DOWN
- tapOn:
    id: review-lab-reset
- scrollUntilVisible:
    element:
      id: review-lab-failure-network-error
    direction: UP
- tapOn:
    id: review-lab-failure-network-error
- scrollUntilVisible:
    element:
      id: review-lab-slow-network
    direction: DOWN
- tapOn:
    id: review-lab-slow-network
- tapOn:
    id: review-lab-close
- scrollUntilVisible:
    element:
      id: input-card-number
    direction: DOWN
- tapOn:
    id: input-card-number
- inputText: "4242424242424242"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-card-expiry
    direction: DOWN
- tapOn:
    id: input-card-expiry
- inputText: "1228"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-card-cvc
    direction: DOWN
- tapOn:
    id: input-card-cvc
- inputText: "123"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: card-submit
    direction: DOWN
- tapOn:
    id: card-submit
- extendedWaitUntil:
    visible:
      id: payment-idempotency-key
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: payment-ledger-count
      text: "1"
    timeout: 10000
- copyTextFrom:
    id: payment-idempotency-key
- evalScript: ${output.paymentKey = maestro.copiedText}
- stopApp
- openLink: exp://127.0.0.1:8082
- tapOn:
    text: "Igor Ganapolsky"
    optional: true
- openLink: exp://127.0.0.1:8082
- extendedWaitUntil:
    visible: "Order confirmed"
    timeout: 20000
- assertVisible:
    id: payment-idempotency-key
    text: ${output.paymentKey}
- assertVisible:
    id: payment-ledger-count
    text: "1"
- assertNotVisible: "Cannot connect to Expo CLI"
- assertNotVisible: "Uncaught.*promise"
- takeScreenshot: checkout-cold-relaunch
