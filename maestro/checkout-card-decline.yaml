appId: host.exp.exponent
name: Issuer decline and retry
---
- openLink: exp://127.0.0.1:8082
- extendedWaitUntil:
    visible:
      id: checkout-screen
    timeout: 60000
- tapOn:
    id: review-lab-open
- scrollUntilVisible:
    element:
      id: review-lab-reset
    direction: DOWN
- tapOn:
    id: review-lab-reset
- scrollUntilVisible:
    element:
      id: review-lab-failure-declined
    direction: UP
- tapOn:
    id: review-lab-failure-declined
- tapOn:
    id: review-lab-close
- scrollUntilVisible:
    element:
      id: input-card-number
    direction: DOWN
- tapOn:
    id: input-card-number
- inputText: "4242424242424242"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-card-expiry
    direction: DOWN
- tapOn:
    id: input-card-expiry
- inputText: "1228"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-card-cvc
    direction: DOWN
- tapOn:
    id: input-card-cvc
- inputText: "123"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: card-submit
    direction: DOWN
- tapOn:
    id: card-submit
- extendedWaitUntil:
    visible: "Payment failed"
    timeout: 15000
- assertVisible: "Card declined by the issuing bank."
- assertVisible:
    id: payment-status-retry
- tapOn:
    id: payment-status-retry
- assertVisible:
    id: checkout-screen
- takeScreenshot: checkout-card-decline
