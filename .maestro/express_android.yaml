appId: com.igorganapolsky.gametimemobilecheckout
name: Google Pay express success on physical Android device
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "checkout-screen"
    timeout: 60000
- tapOn:
    id: "review-lab-open"
- scrollUntilVisible:
    element:
      id: "review-lab-reset"
    direction: DOWN
- tapOn:
    id: "review-lab-reset"
- tapOn:
    id: "review-lab-close"
- tapOn:
    id: "express-google-pay"
- extendedWaitUntil:
    visible:
      id: "express-sheet-pay"
    timeout: 10000
- tapOn:
    id: "express-sheet-pay"
- extendedWaitUntil:
    visible:
      text: "Order confirmed"
    timeout: 20000
- tapOn: "Done"
- assertVisible:
    id: "checkout-screen"
