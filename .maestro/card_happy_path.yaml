appId: com.igorganapolsky.gametimemobilecheckout
name: Card happy path on physical Android device
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "checkout-screen"
    timeout: 60000
- tapOn:
    id: "review-lab-open"
- scrollUntilVisible:
    element:
      id: "review-lab-reset"
    direction: DOWN
- tapOn:
    id: "review-lab-reset"
- tapOn:
    id: "review-lab-close"
- tapOn:
    id: "input-card-number"
- inputText: "4242424242424242"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "input-card-expiry"
    direction: DOWN
- tapOn:
    id: "input-card-expiry"
- inputText: "1228"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "input-card-cvc"
    direction: DOWN
- tapOn:
    id: "input-card-cvc"
- inputText: "123"
- hideKeyboard
- tapOn:
    id: "card-submit"
- extendedWaitUntil:
    visible:
      text: "Order confirmed"
    timeout: 20000
- tapOn: "Done"
- assertVisible:
    id: "checkout-screen"
